name: Backend CI

on:
  push:
    branches: [test-update]
    paths:
      - 'src/main/**'
      - 'src/test/**'
      - 'tests/postman/**'
      - 'docker-compose.lab5.yml'
      - 'Dockerfile'
      - 'qr-service/**'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle.properties'
      - 'gradle/wrapper/gradle-wrapper.properties'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [master, dev]
    paths:
      - 'src/main/**'
      - 'src/test/**'
      - 'tests/postman/**'
      - 'docker-compose.lab5.yml'
      - 'Dockerfile'
      - 'qr-service/**'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle.properties'
      - 'gradle/wrapper/gradle-wrapper.properties'
      - 'scripts/**'
      - '.github/workflows/**'

env:
  IMAGE_NAME: ub-backend

jobs:
  build:
    name: "Build project"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v2
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-deps-ci-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-deps-ci-

      - name: Build project with build cache
        run: |
          chmod +x gradlew
          CI=true ./gradlew clean build -x test --build-cache

  test:
    name: "Run tests"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v2
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Restore Cache Gradle dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-deps-ci-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-deps-ci-

      - name: Run tests with build cache
        run: |
          ./gradlew check --build-cache

  postman-integration:
    name: "Run Postman integration tests"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and start lab5 containers
        run: docker compose -f docker-compose.lab5.yml up -d --build

      - name: Wait for backend API
        run: |
          for i in $(seq 1 60); do
            code=$(curl -u test:test -s -o /dev/null -w "%{http_code}" http://localhost:8082/users/1 || true)
            if [ "$code" != "000" ]; then
              echo "Backend is reachable with HTTP code $code"
              exit 0
            fi
            sleep 5
          done
          echo "Backend is not reachable in time"
          docker compose -f docker-compose.lab5.yml logs
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Postman collection
        run: |
          mkdir -p newman
          newman run tests/postman/tg-bot-cub.postman_collection.json \
            --reporters cli,htmlextra,junit \
            --reporter-htmlextra-export newman/report.html \
            --reporter-junit-export newman/report.xml

      - name: Upload Newman artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman

      - name: Stop lab5 containers
        if: always()
        run: docker compose -f docker-compose.lab5.yml down -v
